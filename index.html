<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ari Dwi Prasetio | Personal Portfolio</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <a href="#main-content" class="c-skip-link">Lanjut ke konten</a>

    <header id="header" class="c-header">
      <div class="c-header__inner">
        <a href="#home" class="c-brand">Ari Dwi Prasetio</a>

        <button
          type="button"
          id="nav-toggle"
          class="c-navigation__toggle"
          aria-controls="primary-navigation"
          aria-expanded="false"
          aria-label="Open navigation"
        >
          <span class="c-navigation__toggle-line" aria-hidden="true"></span>
          <span class="c-navigation__toggle-line" aria-hidden="true"></span>
          <span class="c-navigation__toggle-line" aria-hidden="true"></span>
        </button>

        <nav
          id="primary-navigation"
          class="c-navigation"
          aria-label="Primary navigation"
        >
          <ul class="c-navigation__list" role="list">
            <li class="c-navigation__item">
              <a href="#home" class="c-navigation__link">Home</a>
            </li>
            <li class="c-navigation__item">
              <a href="#about" class="c-navigation__link">About</a>
            </li>
            <li class="c-navigation__item">
              <a href="#skills" class="c-navigation__link">Skills</a>
            </li>
            <li class="c-navigation__item">
              <a href="#projects" class="c-navigation__link">Projects</a>
            </li>
            <li class="c-navigation__item">
              <a href="#contact" class="c-navigation__link">Contact</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content">
      <div class="c-main">
        <div class="c-main__inner">
          <section id="home" class="c-hero" aria-labelledby="hero-title">
            <h2 id="hero-title"></h2>
          </section>
          <section id="about" class="c-about" aria-labelledby="about-title">
            <h2 id="about-title"></h2>
          </section>
          <section id="skills" class="c-skills" aria-labelledby="skills-title">
            <h2 id="skills-title"></h2>
          </section>
          <section
            id="projects"
            class="c-projects"
            aria-labelledby="projects-title"
          >
            <h2 id="projects-title"></h2>
          </section>
          <section
            id="contact"
            class="c-contact"
            aria-labelledby="contact-title"
          >
            <h2 id="contact-title"></h2>
          </section>
        </div>
      </div>
    </main>

    <footer class="c-footer">
      <div class="c-footer__inner"></div>
    </footer>
  </body>
</html>
